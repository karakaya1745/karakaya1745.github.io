name: Discover Missing Channels

on:
  # DEPRECATED: otomatik --apply kaldirildi. Teklif icin proposal-notify.yml kullanin.
  # schedule: KALICI OLARAK KAPALI
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stream-bot-writes
  cancel-in-progress: false

jobs:
  discover-missing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run discover missing channels (DRY-RUN, no --apply)
        run: |
          node tools/stream-health-bot/discover-missing-channels.mjs \
            --stream-map stream_map.json \
            --channels channels.json

      - name: Commit report only (never catalog)
        run: |
          git config user.name "stream-health-bot"
          git config user.email "bot@canlitvtr.local"
          git add tools/stream-health-bot/out/discover_report.json
          if git diff --staged --quiet; then
            echo "Degisiklik yok."
            exit 0
          fi
          git commit -m "discover-missing: dry-run rapor [bot]"
          git pull --rebase --autostash origin main
          git push origin main
