name: Stream Health Bot

on:
  schedule:
    # Her 3 gunde bir 02:00 UTC (05:00 TR) — gun 1, 4, 7, ...
    - cron: "0 2 */3 * *"
  workflow_dispatch:
    inputs:
      all_tv:
        description: "Tum TV kanallari (pilot yerine)"
        type: boolean
        default: false
      pilot:
        description: "Pilot 40 kanal modu"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: stream-bot-writes
  cancel-in-progress: false

jobs:
  maintain-streams:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run stream health bot
        run: |
          ARGS="--stream-map stream_map.json --channels channels.json --apply"
          if [ "${{ github.event.inputs.all_tv }}" = "true" ]; then
            ARGS="$ARGS --all-tv"
          fi
          node tools/stream-health-bot/stream-health-bot.mjs $ARGS

      - name: Commit and push if changed
        run: |
          git config user.name "stream-health-bot"
          git config user.email "bot@canlitvtr.local"
          git add stream_map.json tools/stream-health-bot/out/url_health_state.json
          if git diff --staged --quiet; then
            echo "Degisiklik yok."
            exit 0
          fi
          git commit -m "stream-health: otomatik stream_map guncelleme [bot]"
          git pull --rebase --autostash origin main
          git push origin main
