name: Proposal Notify

on:
  schedule:
    # Every 3 days 05:00 UTC ≈ 08:00 TR
    - cron: "0 5 */3 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stream-bot-writes
  cancel-in-progress: false

jobs:
  propose-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Generate proposals (dry-run only)
        env:
          PROPOSAL_STEP_TIMEOUT_MS: "3600000"
        run: |
          node tools/stream-health-bot/generate-proposals.mjs --health-all-tv
          if ! git diff --quiet -- channels.json stream_map.json; then
            echo "HATA: channels.json veya stream_map.json degisti — proposal modunda yasak"
            git checkout -- channels.json stream_map.json
            exit 1
          fi

      - name: Commit proposals only
        run: |
          git config user.name "stream-health-bot"
          git config user.email "bot@canlitvtr.local"
          # Katalog dosyalarina dokunma. Fail-streak icin url_health_state kalici tutulur.
          git add \
            tools/stream-health-bot/out/proposals_latest.json \
            tools/stream-health-bot/out/proposals_latest.md \
            tools/stream-health-bot/out/proposals_adds.m3u \
            tools/stream-health-bot/out/proposals_*.json \
            tools/stream-health-bot/out/url_health_state.json \
            tools/stream-health-bot/out/maintain_report.json \
            tools/stream-health-bot/out/enrich_report.json \
            tools/stream-health-bot/out/discover_report.json
          if git diff --staged --quiet; then
            echo "Degisiklik yok."
            exit 0
          fi
          COUNT=$(node -e "const p=require('./tools/stream-health-bot/out/proposals_latest.json'); const a=(p.adds||[]).length; const r=(p.removes||[]).length; console.log(a+','+r)")
          ADD_N="${COUNT%%,*}"
          REMOVE_N="${COUNT##*,}"
          git commit -m "proposals: ${ADD_N} ekleme, ${REMOVE_N} kaldırma teklifi (onay bekliyor) [bot]"
          git pull --rebase --autostash origin main
          git push origin main

      - name: Prepare email body
        id: mail
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = "tools/stream-health-bot/out/proposals_latest.json";
          let data = { proposals: [], adds: [], removes: [], summary: {}, generatedAt: "" };
          try {
            data = JSON.parse(fs.readFileSync(path, "utf8"));
          } catch {}
          const s = data.summary || {};
          const flat = Array.isArray(data.proposals) ? data.proposals : [];
          const adds = Array.isArray(data.adds)
            ? data.adds
            : flat.filter((p) => p.action === "add_url" || p.action === "add_channel");
          const removes = Array.isArray(data.removes)
            ? data.removes
            : flat.filter((p) => p.action === "remove_url");
          const addN = adds.length;
          const removeN = removes.length;
          const n = addN + removeN;
          const repo = process.env.GITHUB_REPOSITORY || "karakaya1745/karakaya1745.github.io";
          const rawUrl = `https://raw.githubusercontent.com/${repo}/main/tools/stream-health-bot/out/proposals_latest.md`;
          const m3uRawUrl = `https://raw.githubusercontent.com/${repo}/main/tools/stream-health-bot/out/proposals_adds.m3u`;
          const subject = `[Canlı TV] ${addN} ekleme, ${removeN} kaldırma teklifi`;

          function appendList(lines, list, max) {
            const shown = list.slice(0, max);
            for (const p of shown) {
              lines.push(`- [${p.action}] ${p.channelName} (${p.channelKey})`);
              if (p.url) lines.push(`  ${p.url}`);
              if (p.reason) lines.push(`  ${p.reason}`);
            }
            if (list.length > max) {
              lines.push(``, `... ve ${list.length - max} teklif daha`);
            }
          }

          const lines = [
            `Canlı TV katalog botu — onay bekleyen teklif özeti`,
            ``,
            `Toplam: ${n} teklif (${addN} ekleme, ${removeN} kaldırma)`,
            `  - add_url: ${s.add_url || 0}`,
            `  - add_channel: ${s.add_channel || 0}`,
            `  - remove_url: ${s.remove_url || 0}`,
            `Zaman: ${data.generatedAt || new Date().toISOString()}`,
            ``,
            `NOT: channels.json / stream_map.json otomatik değiştirilmedi.`,
            `Onayladıktan sonra manuel uygulayın.`,
            ``,
            `=== Eklenecek linkler / kanallar (${addN}) ===`,
            ``,
          ];
          if (!addN) {
            lines.push(`(yok)`, ``);
          } else {
            appendList(lines, adds, 20);
            lines.push(``);
          }
          lines.push(`=== Kaldırılacak linkler (${removeN}) ===`, ``);
          if (!removeN) {
            lines.push(`(yok)`, ``);
          } else {
            appendList(lines, removes, 20);
            lines.push(``);
          }
          lines.push(
            `Tam liste:`,
            rawUrl,
            ``,
            `VLC test (yalnızca ekleme teklifleri — add_url / add_channel):`,
            `  Dosya: tools/stream-health-bot/out/proposals_adds.m3u`,
            `  Raw: ${m3uRawUrl}`,
            ``,
          );
          fs.mkdirSync("tools/stream-health-bot/out", { recursive: true });
          fs.writeFileSync("tools/stream-health-bot/out/email_body.txt", lines.join("\n"), "utf8");
          fs.writeFileSync("tools/stream-health-bot/out/email_subject.txt", subject, "utf8");
          const out = [
            `count=${n}`,
            `add_count=${addN}`,
            `remove_count=${removeN}`,
            `subject=${subject}`,
          ].join("\n");
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `${out}\n`);
          console.log(subject);
          NODE

      - name: Check mail secrets
        id: secrets_check
        env:
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          if [ -z "$MAIL_TO" ] || [ -z "$SMTP_SERVER" ] || [ -z "$SMTP_USERNAME" ] || [ -z "$SMTP_PASSWORD" ]; then
            echo "::warning::E-posta secret'lari eksik (MAIL_TO, MAIL_FROM, SMTP_SERVER, SMTP_PORT, SMTP_USERNAME, SMTP_PASSWORD). Bildirim atlandi — workflow basarili sayilir."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "from=${MAIL_FROM:-$SMTP_USERNAME}" >> "$GITHUB_OUTPUT"
            echo "port=${SMTP_PORT:-587}" >> "$GITHUB_OUTPUT"
          fi

      - name: Send email
        if: steps.secrets_check.outputs.ready == 'true'
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ steps.secrets_check.outputs.port }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: ${{ steps.mail.outputs.subject }}
          to: ${{ secrets.MAIL_TO }}
          from: ${{ steps.secrets_check.outputs.from }}
          body: file://tools/stream-health-bot/out/email_body.txt
          content_type: text/plain
          secure: false
          ignore_cert: true
