name: Discover Missing Channels

on:
  schedule:
    # Her 3 gunde bir 03:00 UTC (06:00 TR) — gun 1, 4, 7, ...
    - cron: "0 3 */3 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stream-bot-writes
  cancel-in-progress: false

jobs:
  discover-missing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run discover missing channels
        run: |
          node tools/stream-health-bot/discover-missing-channels.mjs \
            --stream-map stream_map.json \
            --channels channels.json \
            --apply

      - name: Commit and push if changed
        run: |
          git config user.name "stream-health-bot"
          git config user.email "bot@canlitvtr.local"
          git add channels.json stream_map.json tools/stream-health-bot/out/discover_report.json
          if git diff --staged --quiet; then
            echo "Degisiklik yok."
            exit 0
          fi
          git commit -m "discover-missing: yeni kanallar eklendi [bot]"
          git pull --rebase --autostash origin main
          git push origin main
