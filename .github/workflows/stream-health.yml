name: Stream Health Bot

on:
  # DEPRECATED: otomatik --apply kaldirildi. Teklif icin proposal-notify.yml kullanin.
  # schedule: KALICI OLARAK KAPALI (cron + --apply yok)
  workflow_dispatch:
    inputs:
      all_tv:
        description: "Tum TV kanallari (pilot yerine) — dry-run rapor"
        type: boolean
        default: false
      pilot:
        description: "Pilot 40 kanal modu"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: stream-bot-writes
  cancel-in-progress: false

jobs:
  maintain-streams:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run stream health bot (DRY-RUN, no --apply)
        run: |
          ARGS="--stream-map stream_map.json --channels channels.json"
          if [ "${{ github.event.inputs.all_tv }}" = "true" ]; then
            ARGS="$ARGS --all-tv"
          fi
          node tools/stream-health-bot/stream-health-bot.mjs $ARGS

      - name: Commit report only (never catalog)
        run: |
          git config user.name "stream-health-bot"
          git config user.email "bot@canlitvtr.local"
          git add tools/stream-health-bot/out/maintain_report.json tools/stream-health-bot/out/url_health_state.json
          if git diff --staged --quiet; then
            echo "Degisiklik yok."
            exit 0
          fi
          git commit -m "stream-health: dry-run rapor [bot]"
          git pull --rebase --autostash origin main
          git push origin main
