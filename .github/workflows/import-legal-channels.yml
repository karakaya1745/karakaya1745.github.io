name: Import Legal Channels

on:
  # DEPRECATED: otomatik --apply kaldirildi. Teklif icin proposal-notify.yml kullanin.
  # schedule: KALICI OLARAK KAPALI — import-legal proposal pipeline'a dahil degil
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stream-bot-writes
  cancel-in-progress: false

jobs:
  import-legal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run legal M3U import (DRY-RUN, no --apply)
        run: |
          node tools/stream-health-bot/import-legal-m3u-channels.mjs
          node tools/stream-health-bot/import-local-m3u-channels.mjs

      - name: Commit report only (never catalog)
        run: |
          git config user.name "stream-health-bot"
          git config user.email "bot@canlitvtr.local"
          git add tools/stream-health-bot/out/import_legal_report.json tools/stream-health-bot/out/import_local_m3u_report.json
          if git diff --staged --quiet; then
            echo "Degisiklik yok."
            exit 0
          fi
          git commit -m "import-legal: dry-run rapor [bot]"
          git pull --rebase --autostash origin main
          git push origin main
